name: iOS Production Build

# Manual trigger. Runs an EAS build from a GitHub runner, which can reach
# api.expo.dev. The build itself executes on Expo's servers either way — this job
# only submits it and waits for the result.
#
# The filename and the workflow name are historical: this builds any profile on
# either platform, not just iOS production. Kept as-is deliberately so the
# existing PR and any bookmarked Actions URL stay valid.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: >-
          eas.json build profile. production gives a store artifact (.aab on
          Android); preview and android-apk give a sideloadable .apk; appetize is
          an iOS simulator build; development needs the dev client.
        required: true
        default: production
        type: choice
        options:
          - development
          - preview
          - appetize
          - android-apk
          - production
      submit:
        description: Also submit the finished build to TestFlight (iOS + production profile only)
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    # EAS production builds routinely take 20-40 min; the default 360 min job
    # timeout would let a hung build burn Actions minutes for hours.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail early if EXPO_TOKEN is not set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is empty or unset."
            echo "Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Submission is deliberately narrower than building. Android needs a Google
      # Play service-account JSON that is not wired up as a secret, and the ASC key
      # staging below reads submit.production.* from eas.json, so only the
      # production profile is coherent. Fail here with an explanation rather than
      # let the build run for 30 minutes and then die at the submit step.
      - name: Reject unsupported submit combinations
        if: inputs.submit && (inputs.platform != 'ios' || inputs.profile != 'production')
        run: |
          if [ "${{ inputs.platform }}" != "ios" ]; then
            echo "::error::submit is only wired up for iOS. Android submission needs the"
            echo "Google Play service-account JSON (eas.json submit.production.android."
            echo "serviceAccountKeyPath) added as a secret first."
          fi
          if [ "${{ inputs.profile }}" != "production" ]; then
            echo "::error::submit requires the production profile. The ASC API key is read"
            echo "from eas.json submit.production.ios, and the other profiles are internal"
            echo "distribution or simulator builds that App Store Connect will not accept."
          fi
          exit 1

      # eas submit resolves the ASC API key ONLY from the eas.json submit profile —
      # its resolveAscApiKeySource() reads ctx.profile and never consults
      # EXPO_ASC_API_KEY_PATH (those env vars are for `eas metadata` and the
      # provisioning-profile flow). So the key has to exist at the exact path
      # eas.json names. That path is read from eas.json rather than hardcoded, so
      # this keeps working if it is ever changed.
      - name: Stage App Store Connect API key
        if: inputs.submit && inputs.platform == 'ios' && inputs.profile == 'production'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::ASC_API_KEY_P8 repository secret is empty or unset."
            echo "It must contain the full contents of the .p8 file, including the"
            echo "-----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."
            exit 1
          fi
          # Optional chaining so a missing submit block yields an empty string and
          # the guard below reports it, instead of node throwing a raw TypeError.
          # (The default branch's eas.json currently has no submit block at all, so
          # dispatching submit=true against it must fail readably.)
          ASC_PATH="$(node -p "require('./eas.json').submit?.production?.ios?.ascApiKeyPath ?? ''")"
          if [ -z "$ASC_PATH" ] || [ "$ASC_PATH" = "undefined" ]; then
            echo "::error::eas.json on this ref has no submit.production.ios.ascApiKeyPath."
            echo "Dispatch against a branch whose eas.json contains the submit profile."
            exit 1
          fi
          # The configured path is absolute and outside the workspace, so the
          # directory generally does not exist on a fresh runner.
          sudo mkdir -p "$(dirname "$ASC_PATH")"
          sudo chown "$(id -u):$(id -g)" "$(dirname "$ASC_PATH")"
          # umask first so the key is never briefly world-readable.
          ( umask 077 && printf '%s' "$ASC_API_KEY_P8" > "$ASC_PATH" )
          # Record for the cleanup step without re-reading the key itself.
          echo "ASC_PATH=$ASC_PATH" >> "$GITHUB_ENV"
          if ! grep -q "BEGIN PRIVATE KEY" "$ASC_PATH"; then
            echo "::error::ASC_API_KEY_P8 does not look like a PEM private key."
            exit 1
          fi
          echo "Staged ASC API key at $ASC_PATH"

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      # No --no-wait: waiting means this job's conclusion reflects the actual
      # build outcome rather than just a successful submission.
      # --auto-submit chains submission onto the same command, so the submit step
      # uses the build EAS just produced without needing its id passed back in.
      - name: Build (${{ inputs.platform }}, ${{ inputs.profile }} profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            npx eas-cli build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --auto-submit
          else
            npx eas-cli build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
          fi

      # always(): the key must not survive on the runner if the build failed or
      # the job was cancelled.
      - name: Remove staged API key
        if: always() && env.ASC_PATH != ''
        run: |
          shred -u "$ASC_PATH" 2>/dev/null || rm -f "$ASC_PATH"
          echo "Removed $ASC_PATH"
